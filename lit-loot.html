<h1 style="margin: 0; text-align: center; font-family: 'Archivo Black', Impact, sans-serif; font-weight: 400; font-size: clamp(36px, 7vw, 96px); line-height: 0.95; letter-spacing: -0.03em; color: #B57BFF">Lit-Loot</h1>

<a href="https://azrloot.github.io/litloot/downloads/Lit-Loot-Shortcut.zip" download="Lit-Loot-Shortcut.zip" style="display: inline-flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 32px; border-radius: 999px; background: #B57BFF; color: #0E0D0C; font-size: 19px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8.5" height="8.5" rx="1"></rect><rect x="12.5" y="3" width="8.5" height="8.5" rx="1"></rect><rect x="3" y="12.5" width="8.5" height="8.5" rx="1"></rect><rect x="12.5" y="12.5" width="8.5" height="8.5" rx="1"></rect></svg>Download for Windows</a>
<button type="button" id="a2hs" style="display: inline-flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 32px; border: 0; border-radius: 999px; background: #B57BFF; color: #0E0D0C; font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><line x1="11" y1="18" x2="13" y2="18"></line></svg><span>Add to Android Home Screen</span></button>

<p style="margin: 0; max-width: 560px; font-size: 14px; line-height: 1.5; color: #FFFFFF; text-align: center"><b>Windows:</b> unzip and run <b>Lit-Loot-Shortcut-Setup.exe</b>. It asks to add Desktop and Start Menu shortcuts (ZIP · 689 KB).<br><b>Android:</b> open this page in Chrome and tap the button to add Lit-Loot to your home screen.</p>
<p id="a2hs-help" hidden style="margin: 0; max-width: 560px; font-size: 14px; line-height: 1.5; color: #FFFFFF; text-align: center; opacity: .85"></p>
</div>
</div>
<script>
(function(){
  var deferred=null, btn=document.getElementById('a2hs'), help=document.getElementById('a2hs-help');
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;});
  window.addEventListener('appinstalled',function(){btn.querySelector('span').textContent='Added to home screen';});
  btn.addEventListener('click',function(){
    if(deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;});return;}
    var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    help.textContent= ios ? 'On iPhone: tap the Share button in Safari, then "Add to Home Screen".'
      : 'In Chrome on Android: tap the ⋮ menu, then "Add to Home screen" or "Install app". If you are on a computer, open this page on your phone.';
    help.hidden=false;
  });
})();
</script>
