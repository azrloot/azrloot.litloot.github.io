<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Lit-Loot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg:#0E0D0C; --accent:#B57BFF; --line:#4A4540; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#FFFFFF; font-family:Inter, system-ui, sans-serif; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 24px 64px; }
  header { width:100%; max-width:1200px; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; column-gap:16px; }
  .back { justify-self:start; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--line); border-radius:999px; color:#FFFFFF; }
  .back:hover { border-color:var(--accent); }
  .back:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  h1 { margin:0; text-align:center; font-family:'Archivo Black', Impact, sans-serif; font-weight:400; font-size:clamp(56px, 9vw, 120px); line-height:.95; letter-spacing:-.03em; color:var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <a class="back" href="index.html" aria-label="Back to Lit-Loot">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1>Legal</h1>
    <div aria-hidden="true"></div>
  </header>
</main>
</body>
</html>
