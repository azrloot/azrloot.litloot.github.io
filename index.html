<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lit-Loot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg:#0E0D0C; --text:#F4F1EC; --accent:#B57BFF; --line:#4A4540; --panel:#1A1816; --panel-line:#3A3631; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:18vh 24px 64px; gap:48px; }
  h1 { margin:0; font-family:'Archivo Black', Impact, sans-serif; font-weight:400; font-size:clamp(72px, 16vw, 240px); line-height:.9; letter-spacing:-.03em; text-align:center; color:var(--accent); }
  .menu { position:relative; display:flex; flex-direction:column; align-items:center; }
  .menu-btn { width:56px; height:56px; padding:0; display:flex; align-items:center; justify-content:center; background:transparent; border:1.5px solid var(--line); border-radius:999px; cursor:pointer; }
  .menu-btn:hover { border-color:var(--accent); }
  .menu-btn:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  .menu-btn svg { transition:transform 160ms ease; }
  .menu-btn[aria-expanded="true"] svg { transform:rotate(180deg); }
  .menu-list { position:absolute; top:68px; min-width:160px; display:flex; flex-direction:column; padding:6px; background:var(--panel); border:1px solid var(--panel-line); border-radius:14px; }
  .menu-list[hidden] { display:none; }
  .menu-list a { display:block; padding:12px 16px; border-radius:10px; font-size:16px; font-weight:500; color:var(--text); text-decoration:none; text-align:center; }
  .menu-list a:hover, .menu-list a:focus-visible { background:#2A2622; color:var(--accent); outline:none; }
</style>
</head>
<body>
<main>
  <h1>Lit-Loot</h1>
  <nav class="menu">
    <button type="button" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu-list">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B57BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="menu-list" id="menu-list" hidden>
      <a href="legal.html">Legal</a>
    </div>
  </nav>
</main>
<script>
  const btn = document.querySelector('.menu-btn');
  const list = document.getElementById('menu-list');
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    list.hidden = open;
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu')) { btn.setAttribute('aria-expanded', 'false'); list.hidden = true; }
  });
</script>
</body>
</html>
